name = "nexus-worker"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# Serve the built React app from the same Worker — one process, one deploy.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Morning auto-brief: sources are pulled and triaged before you open the app.
# 06:30 UTC weekdays — one model call per day baseline.
[triggers]
crons = ["30 6 * * 1-5"]

# D1 database binding (created via: wrangler d1 create nexus-db)
[[d1_databases]]
binding = "DB"
database_name = "nexus-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

# Secrets (set via: wrangler secret put OPENROUTER_API_KEY)
# OPENROUTER_API_KEY  - your OpenRouter key
# OPENROUTER_MODEL    - optional, e.g. anthropic/claude-3.5-sonnet
# APP_URL             - optional, your deployment URL

[vars]
# Default model; overridable at runtime from Sources → Model picker.
OPENROUTER_MODEL = "moonshotai/kimi-k3"
